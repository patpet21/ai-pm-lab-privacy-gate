[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pm-lab-privacy-gate"
version = "0.4.2"
description = "Local-first Windows desktop app for detecting and protecting PII before using documents with AI."
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
  "spacy>=3.8,<4",
  "pypdf>=6,<7",
  "pdfplumber>=0.11,<1",
  "reportlab>=4.2,<5",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "mcp>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "truststore>=0.10,<1",
  "winrt-runtime>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2.1,<4; sys_platform == 'win32'",
  "winrt-Windows.Services.Store>=3.2.1,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10,<7",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
privacy-gate = "ai_pm_lab_privacy_gate.app:main"
privacy-gate-mcp = "ai_pm_lab_privacy_gate.infrastructure.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
