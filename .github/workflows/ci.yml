name: Windows tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/privacygate-settings-update-center

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Run tests
        run: python -m pytest
      - name: Compile source
        run: python -m compileall -q src
