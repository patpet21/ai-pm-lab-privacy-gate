<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivacyGate Local Restored View</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, sans-serif; }
    .card {
      margin: 0;
      padding: 14px 16px 16px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      border-radius: 14px;
      background: color-mix(in srgb, Canvas 94%, transparent);
      color: CanvasText;
      box-shadow: 0 6px 22px rgba(0,0,0,.10);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .03em;
      color: #16a34a;
      text-transform: uppercase;
    }
    .dot { width: 7px; height: 7px; border-radius: 999px; background: #16a34a; flex: 0 0 7px; }
    .text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.55;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <section class="card" aria-live="polite">
    <div class="header"><span class="dot"></span>PrivacyGate · Local restored view</div>
    <pre id="restored" class="text"></pre>
  </section>
  <script src="multi_ai_restore_overlay.js"></script>
</body>
</html>
