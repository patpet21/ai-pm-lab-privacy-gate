<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>PrivacyGate · Asana connection</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7fafc;color:#062b4f;font-family:Segoe UI,Arial,sans-serif}
    main{width:min(560px,calc(100% - 40px));background:#fff;border:1px solid #d7e2ea;border-radius:20px;padding:36px;box-shadow:0 18px 48px rgba(6,43,79,.12)}
    .mark{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:#fff0ed;color:#f06a6a;font-size:26px;font-weight:900}
    h1{font-size:25px;margin:18px 0 8px}p{color:#557184;line-height:1.55;margin:0 0 12px}.status{margin-top:18px;padding:12px 14px;border-radius:11px;background:#eef8f8;color:#0b7180;font-weight:800}small{display:block;margin-top:24px;padding-top:18px;border-top:1px solid #e4ebf0;color:#d3a13b;font-weight:800;letter-spacing:.7px}
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>Returning to PrivacyGate</h1>
    <p>Asana authorization was received. PrivacyGate is completing the connection locally on this device.</p>
    <div class="status" id="status">Opening PrivacyGate…</div>
    <small>AI PM LAB · PRIVACYGATE</small>
  </main>
  <script>
    (() => {
      const target = 'http://127.0.0.1:8768/asana' + window.location.search;
      // replace() avoids leaving the short-lived OAuth code in the browser history.
      window.location.replace(target);
      setTimeout(() => {
        document.getElementById('status').textContent = 'If PrivacyGate did not open automatically, make sure the desktop app is running and try Connect again.';
      }, 2500);
    })();
  </script>
</body>
</html>
